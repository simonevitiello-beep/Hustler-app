<style>
  :root{
    --bg:#080807; --card:#111009; --card2:#181610; --border:#2A2517;
    --text:#E8E4D8; --muted:#8A8275;
    --gold:#8C7226; --gold-light:#B69847; --gold-dim:#4A3C14;
    --red:#A32D2D; --red-light:#E24B4A; --red-dim:#4A1B0C;
    --green:#3B6D11; --green-light:#639922;
    --amber:#BA7517; --amber-light:#EF9F27;
    --blue:#185FA5;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior-y:none;}
  body{padding-bottom:74px; min-height:100vh;}
  header.top{position:sticky;top:0;z-index:10;padding:18px 16px 16px;
    border-bottom:1px solid var(--gold-dim);
    background:
      radial-gradient(circle at 12% 15%, rgba(182,152,71,0.08), transparent 38%),
      radial-gradient(circle at 88% 25%, rgba(140,114,38,0.07), transparent 35%),
      radial-gradient(circle at 30% 85%, rgba(182,152,71,0.06), transparent 40%),
      radial-gradient(circle at 75% 80%, rgba(140,114,38,0.06), transparent 42%),
      repeating-linear-gradient(122deg, rgba(182,152,71,0.05) 0px, rgba(182,152,71,0.05) 1px, transparent 1px, transparent 9px),
      repeating-linear-gradient(64deg, rgba(140,114,38,0.04) 0px, rgba(140,114,38,0.04) 1px, transparent 1px, transparent 13px),
      repeating-linear-gradient(20deg, rgba(182,152,71,0.035) 0px, rgba(182,152,71,0.035) 1px, transparent 1px, transparent 21px),
      repeating-linear-gradient(160deg, rgba(74,60,20,0.5) 0px, rgba(74,60,20,0.5) 1px, transparent 1px, transparent 31px),
      linear-gradient(150deg, #060605 0%, #100D08 45%, #070706 70%, #0D0B07 100%);}
  header.top h1{font-family:var(--font-display);font-size:22px;margin:0 0 3px;font-weight:700;
    letter-spacing:0.5px;text-transform:uppercase;color:var(--gold-light);}
  header.top .tagline{font-size:11px;color:var(--gold-dim);letter-spacing:0.3px;margin-bottom:6px;}
  header.top .sub{font-size:12.5px;color:var(--muted);}
  main{padding:14px 14px 24px;max-width:560px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:12px;}
  .card h2{font-family:var(--font-display);font-size:15px;margin:0 0 10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.6px;font-weight:500;}
  .row{display:flex;gap:8px;align-items:center;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;}
  .pill.ok{background:rgba(22,163,74,.18);color:#4ADE80;}
  .pill.warn{background:rgba(217,119,6,.18);color:#FBBF24;}
  .pill.bad{background:rgba(220,38,38,.18);color:#F87171;}
  .pill.muted{background:rgba(139,147,167,.15);color:var(--muted);}
  .bar-bg{background:var(--card2);border-radius:8px;height:10px;overflow:hidden;flex:1;}
  .bar-fill{height:100%;border-radius:8px;transition:width .3s;}
  .macro-line{margin-bottom:9px;}
  .macro-line .lbl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .macro-line .lbl b{color:var(--text);font-weight:700;}
  .macro-line .lbl span{color:var(--muted);}
  .banner{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:13px;line-height:1.4;
    border:1px solid;}
  .banner.bad{background:rgba(220,38,38,.1);border-color:rgba(220,38,38,.35);color:#FCA5A5;}
  .banner.warn{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.35);color:#FCD34D;}
  .banner.ok{background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.35);color:#86EFAC;}
  h3.section{font-family:var(--font-display);font-size:14px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.6px;margin:18px 2px 8px;font-weight:500;}
  .btn{appearance:none;border:none;border-radius:10px;padding:11px 14px;font-size:14.5px;
    font-weight:700;cursor:pointer;background:var(--card2);color:var(--text);
    border:1px solid var(--border);}
  .btn:active{transform:scale(.97);}
  .btn.primary,.btn.small{font-family:var(--font-display);letter-spacing:0.4px;}
  .btn.primary{text-transform:uppercase;}
  .btn.primary{background:var(--gold-light);border-color:var(--gold-light);color:#0A0A0A;}
  .btn.ghost{background:transparent;}
  .btn.small{padding:7px 10px;font-size:12.5px;}
  .btn.block{width:100%;}
  input,select,textarea{background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:9px;padding:9px 10px;font-size:14.5px;width:100%;font-family:inherit;}
  label.f{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px;font-weight:600;}
  .field{margin-bottom:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:20;}
  nav.tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-weight:600;}
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:#fff;}
  nav.tabs button.active .ic{color:var(--gold-light);}
  .fissoitem{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 0;border-bottom:1px solid var(--border);}
  .fissoitem:last-child{border-bottom:none;}
  .fissoitem-name{font-size:13.5px;font-weight:600;}
  .fissoitem-macro{font-size:11px;color:var(--muted);}
  .fissoitem-controls{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .fissoitem-controls input{width:56px;text-align:center;padding:8px 4px;}
  .meal-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid var(--border);}
  .meal-item:last-child{border-bottom:none;}
  .meal-item .nm{font-size:13.5px;font-weight:600;}
  .meal-item .mc{font-size:11.5px;color:var(--muted);}
  .meal-item .del{color:var(--muted);background:none;border:none;font-size:18px;padding:2px 6px;}
  .slot-title{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;
    text-transform:uppercase;letter-spacing:.4px;}
  .foodlib-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px;background:var(--card2);border-radius:10px;margin-bottom:6px;border:1px solid var(--border);}
  .foodlib-item .nm{font-size:13px;font-weight:600;}
  .foodlib-item .mc{font-size:11px;color:var(--muted);}
  .foodlib-item button{background:var(--gold-light);color:#0A0A0A;border:none;border-radius:8px;
    padding:7px 12px;font-size:12px;font-weight:700;}
  .tag{display:inline-block;background:var(--card2);border:1px solid var(--border);
    border-radius:8px;padding:3px 8px;font-size:11px;color:var(--muted);margin-right:5px;}
  .exercise{background:var(--card2);border:1px solid var(--border);border-radius:12px;
    padding:10px;margin-bottom:8px;}
  .exercise .exname{font-size:13.5px;font-weight:700;margin-bottom:2px;}
  .exercise .target{font-size:11.5px;color:var(--amber-light);font-weight:700;margin-bottom:4px;}
  .exercise .prev{font-size:12.5px;margin-bottom:8px;}
  .exercise .prev .prevlabel{color:var(--muted);font-weight:600;}
  .exercise .prev .prevval{color:#fff;font-weight:800;}
  .exercise .inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .setrows{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .setrow{display:flex;align-items:center;gap:8px;}
  .setrow .setlabel{width:56px;flex:0 0 auto;font-size:12px;color:var(--muted);font-weight:700;}
  .setrow input{flex:1;min-width:0;padding:8px 4px;text-align:center;}
  .setrow .x{color:var(--muted);font-size:12px;flex:0 0 auto;}
  .exercise .alt{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
  .daysel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
  .daysel button{flex:0 0 auto;background:var(--card2);border:1px solid var(--border);color:var(--muted);
    border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;}
  .daysel button.active{background:var(--gold-light);border-color:var(--gold-light);color:#0A0A0A;}
  svg.chart{width:100%;height:auto;display:block;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;}
  .photogrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .photogrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
  .settingsgroup{margin-bottom:18px;}
  .weekday-map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;}
  .weekday-map div{text-align:center;}
  .weekday-map label.f{text-align:center;}
  a.filebtn{display:block;text-align:center;}
  .stat{background:var(--card2);border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border);}
  .stat .n{font-size:20px;font-weight:800;}
  .stat .l{font-size:10.5px;color:var(--muted);margin-top:2px;}
  table.progtable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
  table.progtable th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;
    border-bottom:1px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;}
  table.progtable td{padding:6px 4px;border-bottom:1px solid var(--border);}
  table.progtable tr:last-child td{border-bottom:none;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1F2937;
    border:1px solid var(--border);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}
</style>
</head>

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultDB(), parsed);
  }catch(e){ return defaultDB(); }
}
function saveDB(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
// Tiene allineati i piatti "di serie" (stesso nome) alle macro più recenti definite in DEFAULT_FOODLIB,
// così le correzioni fatte una volta (es. valori reali presi dal sito Nutribees) si applicano anche
// a chi ha già l'app installata con dati vecchi salvati. Non tocca alimenti aggiunti/rinominati da te.
function reconcileFoodLibrary(){
  let changed = false;
  DEFAULT_FOODLIB.forEach(def=>{
    const existing = DB.foodLibrary.find(f=>f.name===def.name);
    if(existing && (existing.kcal!==def.kcal || existing.pro!==def.pro || existing.carb!==def.carb || existing.fat!==def.fat || existing.costo!==def.costo)){
      existing.kcal=def.kcal; existing.pro=def.pro; existing.carb=def.carb; existing.fat=def.fat; existing.costo=def.costo;
      changed = true;
    }
  });
  if(changed) saveDB();
}
// Stesso principio di reconcileFoodLibrary, ma per gli alimenti del piano fisso (stesso id = valori aggiornati).
// Salta gli item marcati "customized" (modificati a mano dall'utente tramite l'editor in-app),
// altrimenti ogni correzione futura da parte mia cancellerebbe le sue personalizzazioni.
function reconcilePianoFisso(){
  let changed = false;
  if(!DB.pianoFisso) return;
  Object.keys(DEFAULT_PIANO_FISSO).forEach(slot=>{
    if(!DB.pianoFisso[slot]) return;
    DEFAULT_PIANO_FISSO[slot].forEach(def=>{
      const existing = DB.pianoFisso[slot].find(it=>it.id===def.id);
      if(existing && !existing.customized && (existing.kcalU!==def.kcalU || existing.proU!==def.proU || existing.carbU!==def.carbU || existing.fatU!==def.fatU)){
        existing.kcalU=def.kcalU; existing.proU=def.proU; existing.carbU=def.carbU; existing.fatU=def.fatU;
        changed = true;
      }
    });
  });
  if(changed) saveDB();
}

/* ============================= HELPERS ============================= */
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T12:00:00");
  d.setDate(d.getDate()+n);
  return fmtDate(d);
}
function niceDate(dateStr){
  const d = new Date(dateStr+"T12:00:00");
  return `${IT_DAYS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
}
function weekdayOf(dateStr){ return new Date(dateStr+"T12:00:00").getDay(); }
function lunediCorrente(dateStr){
  const wd = weekdayOf(dateStr); // 0=dom..6=sab
  const daysSinceMonday = wd===0 ? 6 : wd-1;
  return addDays(dateStr, -daysSinceMonday);
}
function round1(n){ return Math.round(n*10)/10; }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/* ---- Storico immutabile ------------------------------------------------
   Prima i totali di un giorno passato venivano ricalcolati sui valori ATTUALI
   dell'alimento: modificarlo riscriveva la storia, eliminarlo la faceva sparire.
   Ora ogni registrazione congela i valori del momento (pianoFissoSnap) e gli
   alimenti tolti dal piano finiscono in archivio invece che nel nulla.        */
function resolveFissoItem(dateStr, slot, itemId){
  const bag = DB.pianoFissoSnap && DB.pianoFissoSnap[dateStr] && DB.pianoFissoSnap[dateStr][slot];
  if(bag && bag[itemId]) return bag[itemId];
  const cur = (DB.pianoFisso[slot]||[]).find(it=>it.id===itemId);
  if(cur) return cur;
  const arc = (DB.pianoFissoArchivio||[]).find(it=>it.id===itemId && it.slot===slot);
  if(arc) return arc;
  return null;
}
function snapshotFisso(dateStr, slot, itemId){
  const it = (DB.pianoFisso[slot]||[]).find(x=>x.id===itemId);
  if(!it) return;
  if(!DB.pianoFissoSnap) DB.pianoFissoSnap = {};
  if(!DB.pianoFissoSnap[dateStr]) DB.pianoFissoSnap[dateStr] = {};
  if(!DB.pianoFissoSnap[dateStr][slot]) DB.pianoFissoSnap[dateStr][slot] = {};
  DB.pianoFissoSnap[dateStr][slot][itemId] = {
    id:it.id, l:it.l, unit:it.unit, defaultQty:it.defaultQty,
    kcalU:it.kcalU, proU:it.proU, carbU:it.carbU, fatU:it.fatU, costoU:it.costoU||0
  };
}
// Recupera le righe di log che puntano ad alimenti spariti dal piano: crea una voce
// in archivio, così quei giorni tornano visibili e i valori si possono reinserire.
function migrateFissoOrfani(){
  if(!DB.pianoFissoArchivio) DB.pianoFissoArchivio = [];
  if(!DB.pianoFissoSnap) DB.pianoFissoSnap = {};
  let changed = false;
  Object.keys(DB.pianoFissoLog||{}).forEach(d=>{
    Object.keys(DB.pianoFissoLog[d]||{}).forEach(slot=>{
      Object.keys(DB.pianoFissoLog[d][slot]||{}).forEach(id=>{
        if(!(Number(DB.pianoFissoLog[d][slot][id])>0)) return;
        if(resolveFissoItem(d, slot, id)) return;
        DB.pianoFissoArchivio.push({
          id, slot, l:"⚠ "+id+" — valori da reinserire", unit:"porzione", defaultQty:1,
          kcalU:0, proU:0, carbU:0, fatU:0, costoU:0, archiviato:true
        });
        changed = true;
      });
    });
  });
  if(changed) saveDB();
}
function allMealItemsForDate(dateStr){
  const out = [];
  const log = DB.pianoFissoLog[dateStr] || {};
  const slots = Array.from(new Set(Object.keys(DB.pianoFisso).concat(Object.keys(log))));
  slots.forEach(slot=>{
    const qtys = log[slot] || {};
    const ids = Array.from(new Set(
      (DB.pianoFisso[slot]||[]).map(it=>it.id).concat(Object.keys(qtys))
    ));
    ids.forEach(id=>{
      const qty = Number(qtys[id])||0;
      if(qty<=0) return;
      const item = resolveFissoItem(dateStr, slot, id);
      if(!item) return;
      const label = qty===item.defaultQty ? item.l : `${item.l} ×${qty}`;
      out.push({
        id:"fisso-"+slot+"-"+id, name:label,
        kcal:item.kcalU*qty, pro:item.proU*qty, carb:item.carbU*qty, fat:item.fatU*qty,
        costo:(item.costoU||0)*qty,
        slot, fisso:true
      });
    });
  });
  (DB.meals[dateStr]||[]).forEach(m=> out.push(m));
  return out;
}
function dayCostTotal(dateStr){
  return allMealItemsForDate(dateStr).reduce((s,m)=> s+(Number(m.costo)||0), 0);
}
function dayTotals(dateStr){
  const items = allMealItemsForDate(dateStr);
  return items.reduce((acc,m)=>{
    acc.kcal += Number(m.kcal)||0;
    acc.pro += Number(m.pro)||0;
    acc.carb += Number(m.carb)||0;
    acc.fat += Number(m.fat)||0;
    return acc;
  }, {kcal:0,pro:0,carb:0,fat:0});
}
function setFissoQty(dateStr, slot, itemId, val){
  if(!DB.pianoFissoLog[dateStr]) DB.pianoFissoLog[dateStr] = {};
  if(!DB.pianoFissoLog[dateStr][slot]) DB.pianoFissoLog[dateStr][slot] = {};
  const qty = val==="" ? 0 : Math.max(0, Number(val)||0);
  DB.pianoFissoLog[dateStr][slot][itemId] = qty;
  if(qty>0) snapshotFisso(dateStr, slot, itemId);
  saveDB();
  render();
}
/* ---- Nutribees: libreria, scorte e suggerimenti ---- */
function nutribeesLib(){
  return DB.foodLibrary.filter(f=>f.name.startsWith("Nutribees"));
}
function addNutribeesDish(){
  const nomeGrezzo = document.getElementById("nbNewName").value.trim();
  if(!nomeGrezzo){ toast("Inserisci il nome del piatto"); return; }
  const name = "Nutribees " + nomeGrezzo.replace(/^Nutribees\s*/i,"");
  const kcal = Number(document.getElementById("nbNewKcal").value)||0;
  const pro = Number(document.getElementById("nbNewPro").value)||0;
  const carb = Number(document.getElementById("nbNewCarb").value)||0;
  const fat = Number(document.getElementById("nbNewFat").value)||0;
  const costo = Number(document.getElementById("nbNewCosto").value)||0;
  const existing = DB.foodLibrary.find(f=>f.name.toLowerCase()===name.toLowerCase());
  if(existing){
    existing.kcal=kcal; existing.pro=pro; existing.carb=carb; existing.fat=fat; existing.costo=costo;
    toast(`${name} aggiornato`);
  } else {
    DB.foodLibrary.push({name, kcal, pro, carb, fat, costo});
    toast(`${name} aggiunto`);
  }
  document.getElementById("nbNewName").value="";
  document.getElementById("nbNewKcal").value="";
  document.getElementById("nbNewPro").value="";
  document.getElementById("nbNewCarb").value="";
  document.getElementById("nbNewFat").value="";
  saveDB(); render();
}
function getNutribeesFor(dateStr, slotKey){
  return (DB.meals[dateStr]||[]).find(m=>m.slot===slotKey);
}
function setNutribeesPasto(dateStr, slotKey, libIdx){
  const f = DB.foodLibrary[libIdx];
  if(!f) return;
  const already = (DB.meals[dateStr]||[]).some(m=>m.slot===slotKey);
  DB.meals[dateStr] = (DB.meals[dateStr]||[]).filter(m=>m.slot!==slotKey);
  DB.meals[dateStr].push({id:uid(), name:f.name, kcal:f.kcal, pro:f.pro, carb:f.carb, fat:f.fat, costo:f.costo||0, slot:slotKey});
  if(!already){ DB.nutribeesStock = Math.max(0, (DB.nutribeesStock||0) - 1); }
  saveDB(); toast(`${f.name} aggiunto`); render();
}
function removeNutribeesPasto(dateStr, slotKey){
  const had = (DB.meals[dateStr]||[]).some(m=>m.slot===slotKey);
  DB.meals[dateStr] = (DB.meals[dateStr]||[]).filter(m=>m.slot!==slotKey);
  if(had){ DB.nutribeesStock = (DB.nutribeesStock||0) + 1; }
  saveDB(); render();
}
function nutribeesGiorniResidui(){
  const rate = DB.nutribeesRatePerDay || 2;
  return rate>0 ? (DB.nutribeesStock||0)/rate : Infinity;
}
function nutribeesAvviso(){
  const giorni = nutribeesGiorniResidui();
  const lead = DB.nutribeesLeadDays || 7;
  return { urgente: giorni <= lead, giorni };
}
function nutribeesSuggerimenti(){
  const oggi = todayStr();
  const wd = weekdayOf(oggi); // 0=dom..6=sab
  const daysSinceMonday = (wd+6)%7;
  const lunedi = addDays(oggi, -daysSinceMonday);
  const giorniTrascorsi = daysSinceMonday+1;
  let tot = {pro:0,carb:0,fat:0};
  for(let i=0;i<giorniTrascorsi;i++){
    const t = dayTotals(addDays(lunedi,i));
    tot.pro+=t.pro; tot.carb+=t.carb; tot.fat+=t.fat;
  }
  const targetSettimana = {
    pro: DB.targets.pro*giorniTrascorsi,
    carb: DB.targets.carb*giorniTrascorsi,
    fat: DB.targets.fat*giorniTrascorsi,
  };
  const scostamenti = [
    {k:"pro", label:"proteine", pct: targetSettimana.pro>0 ? tot.pro/targetSettimana.pro : 1},
    {k:"carb", label:"carboidrati", pct: targetSettimana.carb>0 ? tot.carb/targetSettimana.carb : 1},
    {k:"fat", label:"grassi", pct: targetSettimana.fat>0 ? tot.fat/targetSettimana.fat : 1},
  ];
  scostamenti.sort((a,b)=>a.pct-b.pct);
  const piuIndietro = scostamenti[0];
  if(piuIndietro.pct >= 0.95) return null;
  const lib = nutribeesLib();
  if(lib.length===0) return null;
  const ordinati = [...lib].sort((a,b)=> b[piuIndietro.k]-a[piuIndietro.k]);
  return { macro: piuIndietro.label, pct: Math.round(piuIndietro.pct*100), piatti: ordinati.slice(0,3) };
}
// Prossimo giorno di scheda: calcolato SEMPRE dall'ultima sessione segnata "fatta",
// mai dal giorno del calendario. Se non hai mai completato nulla, si parte dal giorno 1.
// Se salti una sessione (nessun dato inserito), il puntatore resta fermo: la prossima
// volta ti verrà riproposto lo stesso giorno finché non lo fai davvero.
function computeNextGiorno(){
  const doneDates = Object.keys(DB.workoutLog).filter(d=>DB.workoutLog[d] && DB.workoutLog[d].done).sort();
  if(doneDates.length===0) return 1;
  const lastDate = doneDates[doneDates.length-1];
  const lastGiorno = DB.workoutLog[lastDate].giorno || 1;
  return (Number(lastGiorno) % 5) + 1;
}
function autoMarkDoneIfData(wl){
  const hasAny = (obj) => obj && Object.values(obj).some(arr =>
    Array.isArray(arr) && arr.some(v => v!=="" && v!==undefined && v!==null && !isNaN(v) && Number(v)>0)
  );
  if(hasAny(wl.pesi) || hasAny(wl.repsLog)){
    wl.done = true;
    wl.skipped = false;
  }
}
function lastWorkoutFor(exKey, beforeDate){
  const dates = Object.keys(DB.workoutLog).filter(d=>d<=beforeDate).sort().reverse();
  for(const d of dates){
    const w = DB.workoutLog[d];
    const kgArr = w && w.pesi && w.pesi[exKey];
    if(Array.isArray(kgArr) && kgArr.some(v=>v!=="" && v!==undefined && v!==null)){
      const repArr = (w.repsLog && w.repsLog[exKey]) || [];
      return {date:d, kg:kgArr, reps:repArr};
    }
  }
  return null;
}

/* ============================= BARCODE SCANNER ============================= */
async function openBarcodeScanner(){
  if(!("BarcodeDetector" in window)){
    toast("Fotocamera non supportata su questo browser — usa il codice manuale qui sotto");
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Fotocamera non disponibile (serve https, non file locale) — usa il codice manuale");
    return;
  }
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  }catch(e){
    toast("Fotocamera non accessibile: usa il codice manuale");
    return;
  }
  const overlay = document.createElement("div");
  overlay.id = "scannerOverlay";
  overlay.style = "position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column;";
  overlay.innerHTML = `
    <video id="scannerVideo" autoplay playsinline muted style="flex:1;object-fit:cover;width:100%;"></video>
    <div style="padding:14px;background:#151B26;display:flex;flex-direction:column;gap:8px;">
      <div style="text-align:center;font-size:12px;color:#8B93A7;">Inquadra il codice a barre</div>
      <button class="btn block" onclick="closeBarcodeScanner()">Annulla</button>
    </div>`;
  document.body.appendChild(overlay);
  const video = document.getElementById("scannerVideo");
  video.srcObject = scannerStream;
  const detector = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
  const loop = async ()=>{
    if(!document.getElementById("scannerOverlay")) return;
    try{
      const codes = await detector.detect(video);
      if(codes.length>0){
        const code = codes[0].rawValue;
        closeBarcodeScanner();
        lookupBarcode(code);
        return;
      }
    }catch(e){}
    scannerRAF = requestAnimationFrame(loop);
  };
  scannerRAF = requestAnimationFrame(loop);
}
function closeBarcodeScanner(){
  if(scannerRAF) cancelAnimationFrame(scannerRAF);
  scannerRAF = null;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  const overlay = document.getElementById("scannerOverlay");
  if(overlay) overlay.remove();
}
async function lookupBarcode(rawCode){
  const code = String(rawCode||"").trim();
  if(!code){ toast("Inserisci un codice a barre"); return; }
  if(DB.barcodeCache[code]){
    barcodeResult = Object.assign({barcode:code, grams:100}, DB.barcodeCache[code]);
    render();
    return;
  }
  toast("Cerco il prodotto...");
  try{
    const resp = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments`);
    const data = await resp.json();
    if(data.status !== 1 || !data.product){ toast("Prodotto non trovato nel database"); return; }
    const p = data.product;
    const n = p.nutriments || {};
    const kcal100 = n["energy-kcal_100g"];
    if(kcal100===undefined || kcal100===null){ toast("Dati nutrizionali mancanti per questo prodotto"); return; }
    const name = [p.product_name, p.brands].filter(Boolean).join(" — ") || `Prodotto ${code}`;
    const info = {
      name,
      kcal100: Number(kcal100)||0,
      pro100: Number(n["proteins_100g"])||0,
      carb100: Number(n["carbohydrates_100g"])||0,
      fat100: Number(n["fat_100g"])||0,
    };
    DB.barcodeCache[code] = info;
    saveDB();
    barcodeResult = Object.assign({barcode:code, grams:100}, info);
    render();
  }catch(e){
    toast("Errore di connessione — riprova o inserisci a mano");
  }
}

}

function renderOggi(app){
  document.getElementById("headerTitle").textContent = "Hustler Fitness";
  document.getElementById("headerSub").textContent = niceDate(todayStr());

  const t = todayStr();
  const yest = addDays(t,-1);
  const totals = dayTotals(t);
  const totalsYest = dayTotals(yest);
  const targets = DB.targets;
  const wlOggi = DB.workoutLog[t];
  const doneOggi = wlOggi && wlOggi.done;
  const giornoOggi = doneOggi ? wlOggi.giorno : computeNextGiorno();

  let banners = "";
  if(totalsYest.kcal>0 && totalsYest.kcal < 1500){
    banners += `<div class="banner bad">⚠️ Ieri sotto le 1500 kcal (${Math.round(totalsYest.kcal)}). Aspettati meno lucidità ed energia nelle call di oggi — recupera con calma, non saltare i prossimi pasti.</div>`;
  }
  const nbAvviso = nutribeesAvviso();
  if(nbAvviso.urgente){
    banners += `<div class="banner bad">⚠️ Scorte Nutribees: ${DB.nutribeesStock||0} pasti rimasti (~${Math.floor(nbAvviso.giorni)} giorni). Con ${DB.nutribeesLeadDays||7} giorni di consegna, ordina ora.</div>`;
  }
  // Promemoria pesata e foto: due avvisi indipendenti, entrambi partono dal lunedì della settimana
  // corrente e restano finché non fai l'azione specifica — non spariscono da soli col cambio di giorno.
  const lunediSettimana = lunediCorrente(t);
  const ritardo = t===lunediSettimana ? "" : ` (dovevi farla lunedì ${niceDate(lunediSettimana)})`;
  const pesoFattoSettimana = DB.pesoLog.some(p=>p.date>=lunediSettimana && p.date<=t);
  if(!pesoFattoSettimana){
    banners += `<div class="banner warn">⚖️ Questa settimana manca ancora la pesata${ritardo}. <button class="btn small" style="margin-top:8px;" onclick="goToProgressi()">Vai a Progressi</button></div>`;
  }
  const fotoFattaSettimana = DB.fotoLog.some(f=>f.date>=lunediSettimana && f.date<=t);
  if(!fotoFattaSettimana){
    banners += `<div class="banner warn">📸 Questa settimana manca ancora la foto progressi${ritardo}. <button class="btn small" style="margin-top:8px;" onclick="goToProgressi()">Vai a Progressi</button></div>`;
  }
  if(!doneOggi){
    banners += `<div class="banner warn">Prossima sessione in coda: <b>${DB.exdb[giornoOggi].label}</b>. Appena inserisci un peso o delle ripetizioni viene segnata fatta e si passa al giorno dopo — se non fai nulla, resta in coda finché non la fai.</div>`;
  } else {
    banners += `<div class="banner ok">Sessione di oggi già segnata: ${DB.exdb[giornoOggi].label} ✅</div>`;
  }
  // streak: giorni di allenamento consecutivi segnati "fatto", scansione a ritroso.
  // Un giorno senza nessuna voce nel log non rompe lo streak (potresti non esserti allenato
  // quel giorno per scelta, senza che sia un salto). Un giorno segnato "saltato" lo rompe.
  let streak = 0;
  for(let i=0;i<90;i++){
    const dd = addDays(t,-i);
    const w = DB.workoutLog[dd];
    if(!w) continue;
    if(w.done) streak++;
    else if(w.skipped) break;
  }

  const last7 = [...Array(7)].map((_,i)=>addDays(t,-i));
  const avgKcal7 = last7.reduce((s,d)=>s+dayTotals(d).kcal,0)/7;

  app.innerHTML = `
    ${banners}
    <div class="card">
      <h2>Target di oggi</h2>
      ${macroBar("Calorie", totals.kcal, targets.kcal, "kcal")}
      ${macroBar("Proteine", totals.pro, targets.pro, "g")}
      ${macroBar("Carboidrati", totals.carb, targets.carb, "g")}
      ${macroBar("Grassi", totals.fat, targets.fat, "g")}
      <div class="row" style="margin-top:8px;">
        <button class="btn primary block" onclick="goToPasti('${t}')">+ Aggiungi pasto</button>
      </div>
    </div>

    <div class="card">
      <h2>Allenamento</h2>
      <div class="row between" style="margin-bottom:8px;">
        <div style="font-size:14px;font-weight:700;">${DB.exdb[giornoOggi].label}</div>
        ${doneOggi ? '<span class="pill ok">Fatto</span>' : '<span class="pill warn">Da fare</span>'}
      </div>
      <button class="btn primary block" onclick="goToAllenamento('${t}')">Apri scheda</button>
    </div>

    <div class="grid3" style="margin-bottom:12px;">
      <div class="stat"><div class="n">${streak}</div><div class="l">giorni streak allenamento</div></div>
      <div class="stat"><div class="n">${Math.round(avgKcal7)}</div><div class="l">kcal medie 7gg</div></div>
      <div class="stat"><div class="n">${DB.pesoLog.length ? DB.pesoLog[DB.pesoLog.length-1].kg+"kg" : "—"}</div><div class="l">ultimo peso</div></div>
    </div>

    <div class="card">
      <h2>Pasti di oggi</h2>
      ${renderMealsList(t, false)}
    </div>
  `;
}
function macroBar(label, val, target, unit){
  const pct = target>0 ? Math.min(100, Math.round((val/target)*100)) : 0;
  let color = "var(--green)";
  if(pct<60) color="var(--amber)";
  if(pct<30) color="var(--red)";
  if(pct>115) color="var(--amber)";
  return `<div class="macro-line">
    <div class="lbl"><b>${label}</b><span>${Math.round(val*10)/10}${unit} / ${target}${unit}</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
  </div>`;
}

function renderExerciseHistoryHtml(exKey){
  const dates = Object.keys(DB.workoutLog).filter(d=>{
    const w = DB.workoutLog[d];
    return w && w.pesi && Array.isArray(w.pesi[exKey]) && w.pesi[exKey].some(v=>v!=="" && v!==null && v!==undefined);
  }).sort();
  if(dates.length===0) return `<div class="empty">Nessun dato registrato per questo esercizio</div>`;
  const topSetSeries = dates.map(d=>{
    const nums = (DB.workoutLog[d].pesi[exKey]||[]).filter(v=>v!=="" && v!==null && v!==undefined && !isNaN(v)).map(Number);
    return {x:d, y: nums.length ? Math.max(...nums) : 0};
  });
  const rows = dates.slice().reverse().map(d=>{
    const kg = DB.workoutLog[d].pesi[exKey]||[];
    const reps = (DB.workoutLog[d].repsLog && DB.workoutLog[d].repsLog[exKey]) || [];
    const setsTxt = kg.map((v,i)=>{
      const kgTxt = (v==="" || v===null || v===undefined) ? "–" : v;
      const r = reps[i];
      const repTxt = (r!==undefined && r!==null && r!=="") ? `×${r}` : "";
      return `${kgTxt}kg${repTxt}`;
    }).join(", ");

  }).join("");
  return `
    ${lineChart(topSetSeries, "#16A34A")}

      <thead><tr><th>Data</th><th>Serie (kg×rip)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}
function weeklyAdherence(){
  const start = DB.programStart;
  const out = [];
  let weekStart = start;
  const now = todayStr();
  let guard=0;
  const target = DB.weeklyTarget || 5;
  while(weekStart <= now && guard<26){
    guard++;
    const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
    let done=0;
    days.forEach(d=>{
      if(d>now) return;
      if(DB.workoutLog[d] && DB.workoutLog[d].done) done++;
    });
    out.push({label:`S${out.length+1}`, done, planned: target});
    weekStart = addDays(weekStart,7);
  }
  return out.slice(-8);
}
function lineChart(series, color, targetLine){
  if(series.length<1) return `<div class="empty">Dati insufficienti</div>`;
  const W=320,H=110,PAD=8;
  const ys = series.map(p=>p.y);
  let min = Math.min(...ys, targetLine||Infinity);
  let max = Math.max(...ys, targetLine||-Infinity);
  if(min===max){ min-=1; max+=1; }
  const stepX = series.length>1 ? (W-2*PAD)/(series.length-1) : 0;
  const pts = series.map((p,i)=>{
    const x = PAD + i*stepX;
    const y = H-PAD - ((p.y-min)/(max-min))*(H-2*PAD);
    return `${x},${y}`;
  });
  let extra = "";
  if(targetLine){
    const ty = H-PAD - ((targetLine-min)/(max-min))*(H-2*PAD);
    extra = `<line x1="${PAD}" y1="${ty}" x2="${W-PAD}" y2="${ty}" stroke="#8B93A7" stroke-width="1" stroke-dasharray="4,3"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${extra}
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="2" fill="${color}"/>`).join("")}
  </svg>
  <div class="row between" style="font-size:11px;color:var(--muted);margin-top:2px;">
    <span>${series[0].x.slice(5)}</span><span>${series[series.length-1].x.slice(5)}</span>
  </div>`;
}
function barChart(weeks){
  if(!weeks.length) return `<div class="empty">Dati insufficienti</div>`;
  const W=320, H=120, PAD=6, gap=6;
  const bw = (W-2*PAD-gap*(weeks.length-1))/weeks.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+18}">
    ${weeks.map((w,i)=>{
      const pct = w.planned>0 ? w.done/w.planned : 0;
      const barH = pct*(H-20);
      const x = PAD+i*(bw+gap);
      const color = pct>=0.8?"#16A34A":pct>=0.5?"#D97706":"#DC2626";
      return `<rect x="${x}" y="${H-barH}" width="${bw}" height="${barH}" rx="3" fill="${color}"/>
        <text x="${x+bw/2}" y="${H+14}" font-size="9" fill="#8B93A7" text-anchor="middle">${w.label}</text>
        <text x="${x+bw/2}" y="${H-barH-4}" font-size="9" fill="#F3F4F6" text-anchor="middle">${w.done}/${w.planned}</text>`;
    }).join("")}
  </svg>`;
}
function addPeso(){
  const d = document.getElementById("pesoDate").value;
  const v = Number(document.getElementById("pesoVal").value);
  if(!d || !v){ toast("Inserisci data e peso"); return; }

function renderPhotoGrid(){
  if(!DB.fotoLog.length) return `<div class="empty">Nessuna foto ancora</div>`;
  const sorted = [...DB.fotoLog].sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="photogrid">${sorted.map(f=>
    f.dataUrl ? `<img src="${f.dataUrl}" onclick="alert('${f.date}${f.note?" — "+f.note.replace(/'/g,""):""}')">` :
    `<div class="stat" style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:10px;">${f.date}<br>(no img)</div>`
  ).join("")}</div>`;
}
function addPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      DB.fotoLog.push({id:uid(), date: todayStr(), note:"", dataUrl});
      saveDB(); toast("Foto salvata"); render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  app.innerHTML = `
    <div class="card settingsgroup">
      <h2>Target giornalieri</h2>
      <div class="grid4">
        <div class="field"><label class="f">Kcal</label><input type="number" id="tKcal" value="${DB.targets.kcal}"></div>
        <div class="field"><label class="f">Pro (g)</label><input type="number" id="tPro" value="${DB.targets.pro}"></div>
        <div class="field"><label class="f">Carb (g)</label><input type="number" id="tCarb" value="${DB.targets.carb}"></div>
        <div class="field"><label class="f">Grassi (g)</label><input type="number" id="tFat" value="${DB.targets.fat}"></div>
      </div>
      <div class="field"><label class="f">Peso obiettivo (kg)</label><input type="number" id="tWeight" inputmode="decimal" step="0.5" value="${DB.targetWeight||71}"></div>
      <button class="btn primary block" onclick="saveTargets()">Salva target</button>
    </div>

    <div class="card settingsgroup">
      <h2>Inizio programma</h2>
      <div class="field"><input type="date" id="programStart" value="${DB.programStart}"></div>
      <button class="btn block" onclick="saveProgramStart()">Salva</button>
    </div>

    <div class="card settingsgroup">
      <h2>Rotazione allenamento</h2>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5;">
        Nessun giorno è legato al calendario. La scheda avanza in coda (1→2→3→4→5→1...) solo quando inserisci
        peso o ripetizioni di un esercizio — quella sessione viene segnata fatta in automatico e si passa al
        giorno successivo. Se non inserisci nulla, la prossima volta ti si ripropone lo stesso giorno.
      </div>
      <div class="row between" style="margin-bottom:12px;">
        <div style="font-size:13px;">Prossimo in coda</div>
        <span class="pill warn">${DB.exdb[computeNextGiorno()].label}</span>
      </div>
      <div class="field"><label class="f">Obiettivo sessioni a settimana (solo per il grafico)</label>
        <input type="number" id="weeklyTarget" value="${DB.weeklyTarget||5}"></div>
      <button class="btn block" onclick="saveWeeklyTarget()">Salva</button>
    </div>

    <div class="card settingsgroup">
      <h2>Scorte Nutribees</h2>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.5;">
        Ogni volta che scegli un piatto Nutribees per pranzo o cena, le scorte scendono di uno in automatico.
        Quando arriva una nuova consegna, aggiorna qui il numero. L'avviso in Home scatta quando le scorte
        finiscono prima che una nuova consegna possa arrivare.
      </div>
      <div class="row between" style="margin-bottom:12px;">
        <div style="font-size:13px;">Scorte attuali</div>
        <span class="pill ${nutribeesAvviso().urgente ? "bad" : "ok"}">${DB.nutribeesStock||0} pasti</span>
      </div>
      <div class="grid3">
        <div class="field"><label class="f">Scorte attuali</label><input type="number" id="nbStock" value="${DB.nutribeesStock||0}"></div>
        <div class="field"><label class="f">Giorni consegna</label><input type="number" id="nbLead" value="${DB.nutribeesLeadDays||7}"></div>
        <div class="field"><label class="f">Pasti/giorno</label><input type="number" id="nbRate" value="${DB.nutribeesRatePerDay||2}"></div>
      </div>
      <button class="btn primary block" onclick="saveNutribeesSettings()">Salva</button>
    </div>

    <div class="card settingsgroup">
      <h2>Editor scheda</h2>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
        Modifica esercizi, serie e target ripetizioni per ogni giorno. Le modifiche si salvano da sole.
      </div>
      <div class="daysel" id="editorDaysel"></div>
      <div id="editorBody"></div>
      <button class="btn block" onclick="resetSchedaDefault()" style="margin-top:10px;border-color:var(--red);color:#F87171;">Ripristina scheda di default</button>
    </div>

    <div class="card settingsgroup">
      <h2>Editor piano alimentare fisso</h2>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
        Modifica le macro per unità, l'unità e la quantità standard di ogni alimento fisso (es. quando correggi
        un valore con l'etichetta reale del prodotto). Le modifiche si salvano da sole.
      </div>
      <div class="daysel" id="editorPastoDaysel"></div>
      <div id="editorPastoBody"></div>
      <button class="btn block" onclick="resetPianoFissoDefault()" style="margin-top:10px;border-color:var(--red);color:#F87171;">Ripristina piano fisso di default</button>
    </div>

    <div class="card settingsgroup">
      <h2>Backup e dati</h2>
      <button class="btn block" style="margin-bottom:8px;" onclick="exportData()">⬇️ Esporta dati (JSON)</button>

      <button class="btn block" style="margin-bottom:8px;" onclick="document.getElementById('importInput').click()">⬆️ Importa export tracker esistente</button>
      <button class="btn block" style="border-color:var(--red);color:#F87171;" onclick="wipeData()">🗑 Cancella tutti i dati</button>

    <div class="card">
      <h2>Info</h2>

  renderSchedaEditor();
  renderPianoFissoEditor();
}
function saveTargets(){
  DB.targets = {
    kcal: Number(document.getElementById("tKcal").value)||0,
    pro: Number(document.getElementById("tPro").value)||0,
    carb: Number(document.getElementById("tCarb").value)||0,
    fat: Number(document.getElementById("tFat").value)||0,
  };
  DB.targetWeight = Number(document.getElementById("tWeight").value)||71;
  saveDB(); toast("Target salvati");
}
function saveProgramStart(){
  DB.programStart = document.getElementById("programStart").value;
  saveDB(); toast("Data salvata");
}
function saveWeeklyTarget(){
  DB.weeklyTarget = Number(document.getElementById("weeklyTarget").value)||5;
  saveDB(); toast("Obiettivo salvato"); render();
}
function saveNutribeesSettings(){
  DB.nutribeesStock = Number(document.getElementById("nbStock").value)||0;
  DB.nutribeesLeadDays = Number(document.getElementById("nbLead").value)||7;
  DB.nutribeesRatePerDay = Number(document.getElementById("nbRate").value)||2;
  saveDB(); toast("Scorte Nutribees salvate"); render();
}

/* ============================= EDITOR SCHEDA ============================= */
function slugify(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "esercizio";
}
function renderSchedaEditor(){
  const strip = document.getElementById("editorDaysel");
  const body = document.getElementById("editorBody");
  if(!strip || !body) return;
  strip.innerHTML = [1,2,3,4,5].map(g=>
    `<button class="${g===editorGiorno?'active':''}" onclick="editorGiorno=${g};renderSchedaEditor();">Giorno ${g}</button>`
  ).join("");
  const day = DB.exdb[editorGiorno];
  body.innerHTML = `
    <div class="field"><label class="f">Titolo giorno</label>
      <input type="text" value="${day.label}" onchange="updateGiornoLabel(${editorGiorno}, this.value)"></div>
    ${day.ex.map((e,idx)=>`
      <div class="exercise" style="margin-bottom:8px;">
        <div class="field"><label class="f">Nome esercizio</label>
          <input type="text" value="${e.l}" onchange="updateExerciseField(${editorGiorno},${idx},'l',this.value)"></div>
        <div class="grid3">
          <div class="field"><label class="f">Serie</label>
            <input type="number" value="${e.sets}" onchange="updateExerciseField(${editorGiorno},${idx},'sets',this.value)"></div>
          <div class="field"><label class="f">Rip. min</label>
            <input type="number" value="${e.repMin}" onchange="updateExerciseField(${editorGiorno},${idx},'repMin',this.value)"></div>
          <div class="field"><label class="f">Rip. max</label>
            <input type="number" value="${e.repMax}" onchange="updateExerciseField(${editorGiorno},${idx},'repMax',this.value)"></div>
        </div>
        <button class="btn small" style="border-color:var(--red);color:#F87171;" onclick="removeExercise(${editorGiorno},${idx})">Elimina esercizio</button>
      </div>
    `).join("")}
    <button class="btn block" onclick="addExercise(${editorGiorno})">+ Aggiungi esercizio</button>
  `;
}
function updateGiornoLabel(giorno, val){
  DB.exdb[giorno].label = val;
  saveDB();
}
function addExercise(giorno){
  const key = slugify("nuovo-esercizio") + "-" + uid().slice(0,4);
  DB.exdb[giorno].ex.push({k:key, l:"Nuovo esercizio", sets:3, repMin:10, repMax:12});
  saveDB(); renderSchedaEditor(); toast("Esercizio aggiunto");
}
function updateExerciseField(giorno, idx, field, val){
  const ex = DB.exdb[giorno].ex[idx];
  if(!ex) return;
  if(field==="l") ex.l = val;
  else if(field==="sets") ex.sets = Math.max(1, Number(val)||1);
  else if(field==="repMin") ex.repMin = Math.max(1, Number(val)||1);
  else if(field==="repMax") ex.repMax = Math.max(ex.repMin||1, Number(val)||1);
  saveDB();
}
function removeExercise(giorno, idx){
  DB.exdb[giorno].ex.splice(idx,1);
  saveDB(); renderSchedaEditor(); toast("Esercizio eliminato");
}
function resetSchedaDefault(){
  if(!confirm("Ripristinare la scheda di default? Le modifiche fatte qui andranno perse (lo storico di pesi/ripetizioni registrato resta intatto).")) return;
  DB.exdb = JSON.parse(JSON.stringify(DEFAULT_EXDB));
  saveDB(); toast("Scheda ripristinata"); render();
}

/* ============================= EDITOR PIANO FISSO ============================= */
const SLOT_LABELS = {
  "colazione":"Colazione", "spuntino-am":"Spuntino mattina",
  "spuntino-pm":"Spuntino pomeriggio", "spuntino-sera":"Spuntino sera"
};
function renderPianoFissoEditor(){
  const strip = document.getElementById("editorPastoDaysel");
  const body = document.getElementById("editorPastoBody");
  if(!strip || !body) return;
  const slots = Object.keys(DB.pianoFisso);
  strip.innerHTML = slots.map(s=>
    `<button class="${s===editorPastoSlot?'active':''}" onclick="editorPastoSlot='${s}';renderPianoFissoEditor();">${SLOT_LABELS[s]||s}</button>`
  ).join("");
  const items = DB.pianoFisso[editorPastoSlot] || [];
  body.innerHTML = items.map((it,idx)=>`
    <div class="exercise" style="margin-bottom:8px;">
      <div class="field"><label class="f">Nome</label>
        <input type="text" value="${it.l}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'l',this.value)"></div>
      <div class="grid2">
        <div class="field"><label class="f">Unità (es. uovo, porzione)</label>
          <input type="text" value="${it.unit}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'unit',this.value)"></div>
        <div class="field"><label class="f">Quantità standard</label>
          <input type="number" step="0.5" value="${it.defaultQty}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'defaultQty',this.value)"></div>
      </div>
      <div class="grid4">
        <div class="field"><label class="f">Kcal/unità</label>
          <input type="number" step="0.1" value="${it.kcalU}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'kcalU',this.value)"></div>
        <div class="field"><label class="f">Pro/unità</label>
          <input type="number" step="0.1" value="${it.proU}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'proU',this.value)"></div>
        <div class="field"><label class="f">Carb/unità</label>
          <input type="number" step="0.1" value="${it.carbU}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'carbU',this.value)"></div>
        <div class="field"><label class="f">Grassi/unità</label>
          <input type="number" step="0.1" value="${it.fatU}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'fatU',this.value)"></div>
      </div>
      <div class="field"><label class="f">Costo/unità (€)</label>
        <input type="number" step="0.01" value="${it.costoU||0}" onchange="updatePianoFissoField('${editorPastoSlot}',${idx},'costoU',this.value)"></div>
      <button class="btn small" style="border-color:var(--red);color:#F87171;" onclick="removePianoFissoItem('${editorPastoSlot}',${idx})">Elimina alimento</button>
    </div>
  `).join("");
  body.innerHTML += `<button class="btn block" onclick="addPianoFissoItem('${editorPastoSlot}')">+ Aggiungi alimento</button>`;
  const arc = (DB.pianoFissoArchivio||[]).filter(a=>a.slot===editorPastoSlot);
  if(arc.length){
    const esc = v => String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
    body.innerHTML += `
      <div class="slot-title" style="margin-top:20px;">Archivio</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px;line-height:1.45;">
        Alimenti non pi\u00f9 nel piano, ma presenti in giorni gi\u00e0 registrati. Restano qui per non
        cancellare lo storico: correggi i valori e i giorni passati si aggiornano.
      </div>` + arc.map(it=>`
      <div class="exercise" style="margin-bottom:8px;border-style:dashed;">
        <div class="field"><label class="f">Nome</label>
          <input type="text" value="${esc(it.l)}" onchange="updateArchivioField('${it.id}','${editorPastoSlot}','l',this.value)"></div>
        <div class="grid4">
          <div class="field"><label class="f">Kcal/unit\u00e0</label>
            <input type="number" step="0.1" value="${it.kcalU}" onchange="updateArchivioField('${it.id}','${editorPastoSlot}','kcalU',this.value)"></div>
          <div class="field"><label class="f">Pro/unit\u00e0</label>
            <input type="number" step="0.1" value="${it.proU}" onchange="updateArchivioField('${it.id}','${editorPastoSlot}','proU',this.value)"></div>
          <div class="field"><label class="f">Carb/unit\u00e0</label>
            <input type="number" step="0.1" value="${it.carbU}" onchange="updateArchivioField('${it.id}','${editorPastoSlot}','carbU',this.value)"></div>
          <div class="field"><label class="f">Grassi/unit\u00e0</label>
            <input type="number" step="0.1" value="${it.fatU}" onchange="updateArchivioField('${it.id}','${editorPastoSlot}','fatU',this.value)"></div>
        </div>
        <div class="field"><label class="f">Costo/unit\u00e0 (\u20ac)</label>
          <input type="number" step="0.01" value="${it.costoU||0}" onchange="updateArchivioField('${it.id}','${editorPastoSlot}','costoU',this.value)"></div>
        <button class="btn small" onclick="ripristinaArchivio('${it.id}','${editorPastoSlot}')">Rimetti nel piano</button>
      </div>`).join("");
  }
}
function updatePianoFissoField(slot, idx, field, val){
  const it = DB.pianoFisso[slot][idx];
  if(!it) return;
  if(field==="l" || field==="unit") it[field] = val;
  else it[field] = Number(val)||0;
  it.customized = true;
  saveDB();
}
function addPianoFissoItem(slot){
  DB.pianoFisso[slot].push({id:"custom-"+uid(), l:"Nuovo alimento", unit:"porzione", kcalU:0, proU:0, carbU:0, fatU:0, defaultQty:1, customized:true});
  saveDB(); renderPianoFissoEditor(); toast("Alimento aggiunto");
}
function removePianoFissoItem(slot, idx){
  const it = DB.pianoFisso[slot][idx];
  if(!it) return;
  if(!confirm(`Togliere "${it.l}" dal piano?\n\nLo storico dei giorni gi\u00e0 registrati resta intatto: l'alimento finisce in Archivio, in fondo a questa pagina.`)) return;
  if(!DB.pianoFissoArchivio) DB.pianoFissoArchivio = [];
  if(!DB.pianoFissoArchivio.some(a=>a.id===it.id && a.slot===slot)){
    DB.pianoFissoArchivio.push(Object.assign({}, it, {slot, archiviato:true}));
  }
  DB.pianoFisso[slot].splice(idx,1);
  saveDB(); renderPianoFissoEditor(); toast("Alimento archiviato");
}
function updateArchivioField(id, slot, field, val){
  const it = (DB.pianoFissoArchivio||[]).find(a=>a.id===id && a.slot===slot);
  if(!it) return;
  if(field==="l" || field==="unit") it[field] = val;
  else it[field] = Number(val)||0;
  saveDB();
  if(field!=="l") renderPianoFissoEditor();
}
function ripristinaArchivio(id, slot){
  const i = (DB.pianoFissoArchivio||[]).findIndex(a=>a.id===id && a.slot===slot);
  if(i<0) return;
  const it = DB.pianoFissoArchivio.splice(i,1)[0];
  delete it.archiviato; delete it.slot;
  if(!DB.pianoFisso[slot]) DB.pianoFisso[slot] = [];
  DB.pianoFisso[slot].push(it);
  saveDB(); renderPianoFissoEditor(); toast("Rimesso nel piano");
}
function resetPianoFissoDefault(){
  if(!confirm("Ripristinare il piano fisso di default? Le modifiche fatte qui andranno perse (lo storico dei pasti registrati resta intatto).")) return;
  DB.pianoFisso = JSON.parse(JSON.stringify(DEFAULT_PIANO_FISSO));
  saveDB(); toast("Piano fisso ripristinato"); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `hustler-tracker-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const old = JSON.parse(ev.target.result);

      // Backup nativo dell'app (creato con "Esporta dati" da questa stessa app):
      // ripristino completo e diretto, nessuna perdita di foto/ripetizioni/scheda personalizzata.
      if(old.version===1 && old.exdb){
        DB = Object.assign(defaultDB(), old);
        saveDB();
        toast("Backup ripristinato");
        render();
        return;
      }

      // Altrimenti: formato del vecchio export del tracker originale (merge parziale, legacy)
      if(old.targets) DB.targets = old.targets;
      if(old.programStart) DB.programStart = old.programStart;
      if(old.meals){
        Object.keys(old.meals).forEach(d=>{
          DB.meals[d] = (old.meals[d]||[]).map(m=>({id:uid(), name:m.name, kcal:m.kcal, pro:m.pro, carb:m.carb, fat:m.fat, slot:m.slot||"storico"}));
        });
      }
      if(old.workoutLog){
        Object.keys(old.workoutLog).forEach(d=>{
          const w = old.workoutLog[d];
          const pesi = {};
          Object.keys(w.pesi||{}).forEach(k=>{
            pesi[k] = Array.isArray(w.pesi[k]) ? w.pesi[k] : [w.pesi[k]];
          });
          const repsLog = {};
          Object.keys(w.reps||{}).forEach(k=>{
            repsLog[k] = Array.isArray(w.reps[k]) ? w.reps[k] : [w.reps[k]];
          });
          DB.workoutLog[d] = {
            giorno: w.giorno||1, done: !!w.done, skipped: !!w.skipped, cardioDone: !!w.cardioDone,
            pesi, repsLog, useAlt: w.useAlt||{}, useAltNote: {}
          };
        });
      }
      if(old.sonnoLog) Object.assign(DB.sonnoLog, old.sonnoLog);
      if(old.pesoLog && Array.isArray(old.pesoLog)) DB.pesoLog = DB.pesoLog.concat(old.pesoLog);
      if(old.fotoLogMeta && Array.isArray(old.fotoLogMeta)){
        old.fotoLogMeta.forEach(f=>{
          DB.fotoLog.push({id:uid(), date:f.date, note:f.note||"", dataUrl:null});
        });
      }
      saveDB();
      toast("Import completato");
      render();
    }catch(e){
      alert("File non valido: "+e.message);
    }
  };
  reader.readAsText(file);
}
function wipeData(){
  if(!confirm("Cancellare TUTTI i dati salvati su questo telefono? Non si può annullare.")) return;
  localStorage.removeItem(STORE_KEY);
  DB = defaultDB();
  toast("Dati cancellati");
  render();
}

/* ============================= INIT ============================= */
render();
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
